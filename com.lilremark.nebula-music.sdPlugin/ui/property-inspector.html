<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Nebula Music</title>
    <style>
      :root {
        color-scheme: dark;
        font:
          13px Inter,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        --bg: #0a0a0a;
        --panel: #111111;
        --surface: #171717;
        --elevated: #262626;
        --border: #2a2a2a;
        --border-strong: #3a3a3a;
        --text: #fafafa;
        --text-secondary: #d4d4d4;
        --text-muted: #a3a3a3;
        --text-subtle: #737373;
        --accent: #06b6d4;
        --accent-ink: #06222b;
        --accent-soft: rgb(6 182 212 / 12%);
        --accent-ring: rgb(6 182 212 / 26%);
        --warning: #f59e0b;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 14px;
        color: var(--text);
        background: radial-gradient(130% 100% at 50% 0%, #141414 0%, var(--bg) 55%);
        -webkit-font-smoothing: antialiased;
      }
      .action-header {
        margin-bottom: 14px;
        padding: 6px 2px 16px;
        border-bottom: 1px solid var(--border);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 7px;
        margin-bottom: 8px;
        color: var(--text-muted);
        font-size: 10px;
        font-weight: 750;
        letter-spacing: 1.8px;
        text-transform: uppercase;
      }
      .brand-chip {
        display: grid;
        flex: 0 0 auto;
        place-items: center;
        width: 20px;
        height: 20px;
        border-radius: 6px;
        color: var(--accent-ink);
        background: var(--accent);
        box-shadow: 0 0 12px rgb(6 182 212 / 35%);
      }
      .brand-chip svg {
        width: 13px;
        height: 13px;
      }
      h1 {
        margin: 0;
        font-size: 17px;
        font-weight: 700;
        letter-spacing: -0.2px;
      }
      .description {
        margin: 6px 0 0;
        color: var(--text-muted);
        font-size: 13px;
        line-height: 1.5;
      }
      .panel {
        margin: 0 0 12px;
        overflow: hidden;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--panel);
      }
      .panel-head {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 12px;
        border-bottom: 1px solid var(--border);
        background: rgb(255 255 255 / 3%);
      }
      .panel-chip {
        display: grid;
        flex: 0 0 auto;
        place-items: center;
        width: 22px;
        height: 22px;
        border-radius: 7px;
        color: var(--accent);
        background: var(--accent-soft);
        box-shadow: inset 0 0 0 1px var(--accent-ring);
      }
      .panel-chip svg {
        width: 13px;
        height: 13px;
      }
      .panel h2 {
        margin: 0;
        color: var(--text-secondary);
        font-size: 10px;
        font-weight: 750;
        letter-spacing: 1.4px;
        text-transform: uppercase;
      }
      .panel-body {
        padding: 10px 12px 12px;
      }
      label {
        display: grid;
        gap: 6px;
        margin: 12px 0 0;
        color: var(--text-muted);
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.9px;
        text-transform: uppercase;
      }
      label:first-of-type {
        margin-top: 0;
      }
      input,
      select,
      button {
        width: 100%;
        min-height: 34px;
        border: 1px solid var(--border-strong);
        border-radius: 8px;
        color: var(--text);
        background: rgb(255 255 255 / 5%);
        font: inherit;
        letter-spacing: 0;
        text-transform: none;
      }
      input,
      select {
        padding: 0 10px;
      }
      input::placeholder {
        color: var(--text-subtle);
      }
      input:focus,
      select:focus,
      button:focus-visible {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--accent-ring);
      }
      select option {
        color: var(--text);
        background: var(--surface);
      }
      button {
        cursor: pointer;
        border-color: transparent;
        color: var(--accent-ink);
        background: var(--accent);
        font-weight: 700;
      }
      button:hover {
        filter: brightness(1.08);
      }
      button.secondary {
        border-color: var(--border-strong);
        color: var(--text);
        background: rgb(255 255 255 / 8%);
        font-weight: 600;
      }
      button.secondary:hover {
        background: rgb(255 255 255 / 13%);
      }
      .row {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 7px;
      }
      .row button {
        width: auto;
        padding: 0 12px;
      }
      .status {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 10px;
        border: 1px solid var(--border-strong);
        border-radius: 999px;
        background: rgb(255 255 255 / 4%);
        color: var(--text-secondary);
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.3px;
        text-transform: uppercase;
      }
      .dot {
        flex: 0 0 auto;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--text-subtle);
        box-shadow: 0 0 0 3px rgb(115 115 115 / 16%);
      }
      .dot.ok {
        background: var(--accent);
        box-shadow:
          0 0 0 3px var(--accent-ring),
          0 0 8px rgb(6 182 212 / 50%);
      }
      .dot.warn {
        background: var(--warning);
        box-shadow: 0 0 0 3px rgb(245 158 11 / 16%);
      }
      .code {
        margin: 12px 0;
        padding: 13px 8px;
        border: 1px solid var(--accent-ring);
        border-radius: 10px;
        text-align: center;
        background: rgb(6 182 212 / 7%);
        color: var(--text);
        font-family: ui-monospace, "SFMono-Regular", Consolas, monospace;
        font-size: 24px;
        font-weight: 750;
        letter-spacing: 6px;
      }
      .hint {
        margin: 10px 0 0;
        color: var(--text-muted);
        font-size: 13px;
        line-height: 1.5;
      }
      .client {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 8px;
        align-items: center;
        margin-top: 8px;
        padding-top: 8px;
        border-top: 1px solid var(--border);
      }
      .client span {
        overflow: hidden;
        color: var(--text-secondary);
        font-size: 13px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .client button {
        width: auto;
        min-height: 28px;
        padding: 0 10px;
        font-size: 13px;
      }
      .hidden {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <header class="action-header">
      <div class="brand">
        <span class="brand-chip" aria-hidden="true">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M9 18V5l12-2v13" />
            <circle cx="6" cy="18" r="3" />
            <circle cx="18" cy="16" r="3" />
          </svg>
        </span>
        Nebula Music
      </div>
      <h1 id="action-name">Action</h1>
      <p id="action-description" class="description"></p>
    </header>

    <section id="action-settings" class="panel hidden">
      <div class="panel-head">
        <span class="panel-chip" aria-hidden="true">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <line x1="4" y1="21" x2="4" y2="14" />
            <line x1="4" y1="10" x2="4" y2="3" />
            <line x1="12" y1="21" x2="12" y2="12" />
            <line x1="12" y1="8" x2="12" y2="3" />
            <line x1="20" y1="21" x2="20" y2="16" />
            <line x1="20" y1="12" x2="20" y2="3" />
            <line x1="1" y1="14" x2="7" y2="14" />
            <line x1="9" y1="8" x2="15" y2="8" />
            <line x1="17" y1="16" x2="23" y2="16" />
          </svg>
        </span>
        <h2>Settings</h2>
      </div>
      <div class="panel-body">
        <label id="playlist-setting" class="hidden">
          Playlist
          <select id="playlist"></select>
        </label>
        <label id="playback-setting" class="hidden">
          Multi Action behavior
          <select id="desired-state">
            <option value="toggle">Toggle playback</option>
            <option value="play">Always play</option>
            <option value="pause">Always pause</option>
          </select>
        </label>
        <label id="seek-setting" class="hidden">
          Seconds per dial tick
          <input id="seek-step" type="number" min="1" max="60" value="5" />
        </label>
        <label id="volume-setting" class="hidden">
          Percent per dial tick
          <input id="volume-step" type="number" min="1" max="20" value="2" />
        </label>
        <label id="tuning-target-setting" class="hidden">
          Knob changes
          <select id="tuning-target">
            <option value="speed">Speed</option>
            <option value="pitch">Pitch</option>
            <option value="both">Speed and pitch</option>
          </select>
        </label>
      </div>
    </section>

    <section id="connection-settings" class="panel hidden">
      <div class="panel-head">
        <span class="panel-chip" aria-hidden="true">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71" />
            <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71" />
          </svg>
        </span>
        <h2>Browser connection</h2>
      </div>
      <div class="panel-body">
        <div class="status">
          <span id="dot" class="dot"></span><span id="status">Starting…</span>
        </div>
        <div id="pairing-code" class="code hidden"></div>
        <button id="pair">Generate pairing code</button>
        <p class="hint">
          Enter the one-time code in Nebula Music → Settings → Stream Deck. It expires after five
          minutes.
        </p>
        <label>
          Loopback port
          <div class="row">
            <input id="port" type="number" min="1024" max="65525" value="37921" />
            <button id="save-port" class="secondary">Apply</button>
          </div>
        </label>
        <label>
          Controlled tab
          <select id="instance">
            <option value="">Automatic</option>
          </select>
        </label>
        <div id="clients"></div>
      </div>
    </section>

    <script>
      const ACTIONS = {
        "now-playing": {
          name: "Now Playing",
          description:
            "Album cover and scrolling track metadata. Key: display only. Dial: rotate or tap to seek; press to play or pause.",
          settings: ["seek-setting"]
        },
        "play-pause": {
          name: "Play / Pause",
          description: "Toggles playback, or uses an explicit state inside Multi Actions.",
          settings: ["playback-setting"]
        },
        previous: {
          name: "Previous",
          description: "Restarts the current track or moves to the previous track."
        },
        next: {
          name: "Next",
          description: "Moves to the next track using Nebula Music’s queue behavior."
        },
        volume: {
          name: "Volume",
          description: "Press to mute, rotate to adjust, or tap the strip to set an exact level.",
          settings: ["volume-setting"]
        },
        "speed-pitch": {
          name: "Speed & Pitch",
          description:
            "Rotate to adjust speed, pitch, or both. Press the dial to switch between digital independent control and analogue vinyl-style control.",
          settings: ["tuning-target-setting"]
        },
        playlist: {
          name: "Playlist",
          description: "Starts one selected Nebula Music playlist.",
          settings: ["playlist-setting"]
        },
        "playlist-browser": {
          name: "Playlist Browser",
          description: "Rotate through playlists and press or tap to start the selection."
        },
        connection: {
          name: "Connection",
          description: "Pairs Nebula Music and chooses which browser tab this plugin controls.",
          connection: true
        }
      };

      let socket;
      let propertyInspectorUUID;
      let actionUUID;
      let actionKey;
      let settings = {};
      let connection = { instances: [] };
      let playlists = [];

      window.connectElgatoStreamDeckSocket = function (
        port,
        uuid,
        registerEvent,
        info,
        actionInfo
      ) {
        propertyInspectorUUID = uuid;
        const parsed = JSON.parse(actionInfo);
        actionUUID = parsed.action;
        actionKey = actionUUID.split(".").at(-1);
        settings = parsed.payload?.settings || {};
        configureAction();
        applySettings();

        socket = new WebSocket(`ws://127.0.0.1:${port}`);
        socket.addEventListener("open", () => {
          socket.send(JSON.stringify({ event: registerEvent, uuid }));
          if (actionKey === "connection" || actionKey === "playlist") {
            sendPlugin({ type: "getStatus" });
          }
        });
        socket.addEventListener("message", (event) => {
          const message = JSON.parse(event.data);
          if (message.event === "didReceiveSettings") {
            settings = message.payload?.settings || {};
            applySettings();
          } else if (message.event === "sendToPropertyInspector") {
            if (message.payload?.type === "connection") {
              connection = message.payload;
              renderConnection();
            } else if (message.payload?.type === "playlists") {
              playlists = message.payload.playlists || [];
              renderPlaylists();
            }
          }
        });
      };

      function sendPlugin(payload) {
        if (socket?.readyState !== WebSocket.OPEN) return;
        socket.send(
          JSON.stringify({
            event: "sendToPlugin",
            action: actionUUID,
            context: propertyInspectorUUID,
            payload
          })
        );
      }

      function saveSettings(patch) {
        settings = { ...settings, ...patch };
        if (socket?.readyState !== WebSocket.OPEN) return;
        socket.send(
          JSON.stringify({
            event: "setSettings",
            context: propertyInspectorUUID,
            payload: settings
          })
        );
      }

      function configureAction() {
        const config = ACTIONS[actionKey] || {
          name: "Nebula Music",
          description: "Control Nebula Music from Stream Deck."
        };
        document.getElementById("action-name").textContent = config.name;
        document.getElementById("action-description").textContent = config.description;
        for (const id of config.settings || []) {
          document.getElementById(id).classList.remove("hidden");
        }
        document
          .getElementById("action-settings")
          .classList.toggle("hidden", !(config.settings || []).length);
        document
          .getElementById("connection-settings")
          .classList.toggle("hidden", !config.connection);
      }

      function applySettings() {
        document.getElementById("desired-state").value = settings.desiredState || "toggle";
        document.getElementById("seek-step").value = settings.seekStepSeconds || 5;
        document.getElementById("volume-step").value = settings.volumeStepPercent || 2;
        document.getElementById("tuning-target").value = settings.tuningTarget || "speed";
        renderPlaylists();
      }

      function renderConnection() {
        const connected = connection.instances.some((item) => item.authenticated);
        const pairingRequired = !connected && connection.instances.length > 0;
        const statusText =
          connection.status === "port-conflict"
            ? "Port unavailable"
            : connected
              ? "Connected"
              : pairingRequired
                ? "Pairing required"
                : "Waiting for Nebula Music";
        document.getElementById("status").textContent = statusText;
        const dot = document.getElementById("dot");
        dot.classList.toggle("ok", connected);
        dot.classList.toggle("warn", pairingRequired || connection.status === "port-conflict");
        document.getElementById("port").value = connection.port || 37921;
        const code = document.getElementById("pairing-code");
        code.textContent = connection.pairingCode || "";
        code.classList.toggle("hidden", !connection.pairingCode);

        const instance = document.getElementById("instance");
        instance.replaceChildren(new Option("Automatic", ""));
        for (const item of connection.instances) {
          const state = item.playing ? "playing" : item.visible ? "visible" : "idle";
          instance.add(new Option(`${item.origin} — ${state}`, item.sessionId));
        }
        instance.value = connection.pinnedSessionId || "";

        const clients = document.getElementById("clients");
        clients.replaceChildren();
        for (const item of connection.instances.filter((entry) => entry.authenticated)) {
          const row = document.createElement("div");
          row.className = "client";
          const name = document.createElement("span");
          name.textContent = item.origin;
          const unpair = document.createElement("button");
          unpair.className = "secondary";
          unpair.textContent = "Unpair";
          unpair.addEventListener("click", () =>
            sendPlugin({ type: "unpair", clientId: item.clientId })
          );
          row.append(name, unpair);
          clients.append(row);
        }
      }

      function renderPlaylists() {
        const select = document.getElementById("playlist");
        select.replaceChildren(new Option("Choose a playlist…", ""));
        for (const item of playlists) select.add(new Option(item.name, item.id));
        select.value = settings.playlistId || "";
      }

      document
        .getElementById("pair")
        .addEventListener("click", () => sendPlugin({ type: "generatePairingCode" }));
      document
        .getElementById("save-port")
        .addEventListener("click", () =>
          sendPlugin({ type: "setPort", port: Number(document.getElementById("port").value) })
        );
      document
        .getElementById("instance")
        .addEventListener("change", (event) =>
          sendPlugin({ type: "pinInstance", sessionId: event.target.value })
        );
      document.getElementById("playlist").addEventListener("change", (event) => {
        const option = event.target.selectedOptions[0];
        saveSettings({ playlistId: event.target.value, playlistName: option?.text || "" });
      });
      document
        .getElementById("desired-state")
        .addEventListener("change", (event) => saveSettings({ desiredState: event.target.value }));
      document
        .getElementById("seek-step")
        .addEventListener("change", (event) =>
          saveSettings({ seekStepSeconds: Number(event.target.value) })
        );
      document
        .getElementById("volume-step")
        .addEventListener("change", (event) =>
          saveSettings({ volumeStepPercent: Number(event.target.value) })
        );
      document
        .getElementById("tuning-target")
        .addEventListener("change", (event) => saveSettings({ tuningTarget: event.target.value }));

      const previewAction = new URLSearchParams(window.location.search).get("preview");
      if (previewAction && ACTIONS[previewAction]) {
        actionKey = previewAction;
        configureAction();
        applySettings();
        if (previewAction === "connection") renderConnection();
      }
    </script>
  </body>
</html>
