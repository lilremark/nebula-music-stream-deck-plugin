name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/verify-version.mjs
      - run: npm run check
      - run: npm audit --audit-level=high
      - run: npm run validate
      - run: mkdir -p dist
      - run: npx streamdeck pack com.lilremark.nebula-music.sdPlugin --output dist --no-update-check
      - run: sha256sum dist/*.streamDeckPlugin > dist/SHA256SUMS
      - uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: dist/*.streamDeckPlugin
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stream-deck-plugin
          path: dist/
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          prerelease: true
          generate_release_notes: true
          files: |
            dist/*.streamDeckPlugin
            dist/SHA256SUMS
